<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Tower Defense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui-top">
    <span>❤️ <b id="hp">20</b></span>
    <span>💰 <b id="gold">175</b></span>
    <span>🌊 <b id="wave">0</b> (🏆 <b id="best">0</b>)</span>
    <select id="map-sel" onchange="changeMap()">
      <option value="0">🗺️ K1</option>
      <option value="1">🌀 K2</option>
      <option value="2">⚡ K3</option>
    </select>
    <select id="diff-sel" onchange="changeDiff()">
      <option value="0.75">🟢 Leicht</option>
      <option value="1" selected>🟡 Normal</option>
      <option value="1.35">🔴 Extrem</option>
    </select>
    <button class="spd-btn" id="btn-snd" onclick="toggleSound()">🔊</button>
    <button class="spd-btn" id="btn-spd" onclick="toggleSpeed()">1x</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="game"></canvas>
    <div id="gameover-overlay" style="display:none;">
      <h2>💀 GAME OVER</h2>
      <p>Du hast <b>Welle <span id="end-wave">0</span></b> erreicht!</p>
      <button class="wave-btn" style="padding:12px 24px;font-size:16px;" onclick="resetGame()">🔄 Nochmal spielen</button>
    </div>
  </div>

  <div id="upgrade-bar" style="display:none;">
    <span id="sel-info">Turm St. 1</span>
    <button class="upg" id="btn-upg" onclick="upgradeTower()">⬆️ Upgrade</button>
    <button class="sell" onclick="sellTower()">🗑️</button>
  </div>

  <div id="ui-bottom">
    <button class="t-btn active" id="t-laser" onclick="selectType('laser')">🔫 Laser<br><small>50💰</small></button>
    <button class="t-btn" id="t-ice" onclick="selectType('ice')">❄️ Eis<br><small>75💰</small></button>
    <button class="t-btn" id="t-sniper" onclick="selectType('sniper')">🎯 Sniper<br><small>95💰</small></button>
    <button class="t-btn" id="t-rocket" onclick="selectType('rocket')">🚀 Rakete<br><small>110💰</small></button>
    <button class="t-btn" id="t-mine" onclick="selectType('mine')">⛏️ Mine<br><small>100💰</small></button>
  </div>

  <div id="ui-actions">
    <button class="nuke-btn" id="btn-nuke" onclick="airstrike()">💣 Luftangriff (90💰)</button>
    <button class="wave-btn" id="btn-wave" onclick="startWave()">▶ Nächste Welle</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
